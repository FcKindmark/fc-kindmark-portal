<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FC Kindmark | Training Planner</title><style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#f4f2ea;background:#0b0b0b}*{box-sizing:border-box}body{margin:0}header{padding:24px clamp(16px,4vw,52px);border-bottom:1px solid #5e4b24;display:flex;align-items:center;justify-content:space-between;gap:12px}h1{font-size:clamp(23px,4vw,37px);margin:0;color:#d4af37}header small{color:#c9a24d}main{max-width:1200px;margin:auto;padding:24px 16px 70px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 22px}button{background:#1c1c1c;border:1px solid #665327;color:white;border-radius:9px;padding:10px 15px;cursor:pointer;font:inherit}button.active{background:#d4af37;color:#0b0b0b;font-weight:700}.layout{display:grid;grid-template-columns:260px 1fr;gap:20px}.sidebar{display:grid;align-content:start;gap:8px}.session{width:100%;text-align:left;font-size:13px}.session strong{display:block;font-size:15px}.session span{color:#bcb8aa}.active span{color:#282217}.panel{border:1px solid #665327;border-radius:16px;padding:clamp(14px,3vw,28px);background:#141414}h2{color:#d4af37;margin:0 0 8px}.sub{color:#aaa;margin-bottom:22px}.pitch{background:#216344;border-radius:12px;overflow:hidden;margin:14px 0}.pitch svg{display:block;width:100%;height:auto}section{margin-top:20px}h3{color:#d4af37;font-size:16px;margin:0 0 8px}p{line-height:1.55}.schedule{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}.schedule div{border:1px solid #444;padding:10px 7px;border-radius:7px;font-size:12px}.schedule b{display:block;color:#d4af37}.note{color:#bfbfbf;font-size:13px}footer{color:#aaa;font-size:12px;margin-top:25px}@media(max-width:720px){.layout{grid-template-columns:1fr}.sidebar{grid-template-columns:repeat(2,minmax(0,1fr))}.schedule{grid-template-columns:repeat(2,1fr)}}

</style></head><body><header><div><small>FC KINDMARK · DEVELOPMENT FRAMEWORK</small><h1>TRAINING PLANNER</h1></div><small>DARE TO DO MORE</small></header><main><p class="note">16 coach-ready sessions · Phase 2 · Decision-making through game-realistic practice · Tactical diagrams are illustrative, not to scale.</p><div class="filters"><button id="t13" onclick="choose('P2013')">P2013 · 13 players</button><button id="t11" onclick="choose('P2011')">P2011 · 15 players</button><button onclick="window.print()">Print session</button></div><div class="layout"><nav class="sidebar" id="list" aria-label="Sessions"></nav><article class="panel" id="detail"></article></div></main><script>
const data=[["P2013",1,"A","Scanning & open body","4v4 + 2 wide neutrals","26×20 m","75","Scan before receiving; open hips; far-foot reception","Neutral players on touchlines; score by receiving beyond end line.","Add two-touch limit only when scanning succeeds.","What did you see before the ball arrived?"],["P2013",1,"B","Creating passing lanes","3v3 + 2 neutrals","24×18 m","75","Move while ball travels; offer width and depth","Point for splitting a defensive line with a pass.","Neutral players limited to one touch.","Where could you move to create a new passing lane?"],["P2013",2,"A","First touch under pressure","3v3 with directional gates","22×18 m","75","Check shoulder; touch away from pressure","Attack through either of two exit gates.","Narrow pitch or bring defender closer.","Where should your first touch take you?"],["P2013",2,"B","Dribble or pass?","2v1 repeated waves","20×16 m","75","Recognise isolated defender and supporting runner","Two attackers break against one defender, rotate quickly.","Recovery defender enters after three seconds.","When is carrying better than passing?"],["P2013",3,"A","Winning the ball → attack","3v3 continuous transition","26×20 m","75","Look forward immediately after regain","On winning possession attack opposite mini-goal.","Add neutral target to reward supporting runs.","What is the first opportunity after a regain?"],["P2013",3,"B","Losing the ball → react","4v4 + keepers / mini-goals","30×22 m","75","Nearest player pressures; others cover","Ball loss triggers immediate defensive transition.","Add five-second regain bonus, never mandatory.","Who presses and who protects space?"],["P2013",4,"A","Space → receive → attack","4v4 + 2 supports","28×22 m","75","Connect scanning, body shape and support","Directional game with end zones and instant restart.","Reduce available space in final third.","How did your movement help the next action?"],["P2013",4,"B","Integrated decision game","5v5 + 3 rotating players","32×24 m","75","Observe choices, not only goals","Short free-play blocks; rotate players and roles.","Add tactical condition only if needed.","Which decision would you repeat and why?"],["P2011",1,"A","Scanning & positional orientation","4v4 + 3 neutrals","32×26 m","90","Scan early; create diagonal support","Maintain possession while progressing to target zone.","Neutral players two-touch, then one-touch.","What did you recognise before receiving?"],["P2011",1,"B","Support and passing lines","5v5 + 3 neutrals","36×28 m","90","Occupy different lines; create third-player options","Score by progressing through middle into final zone.","Add recovering defender after line break.","Which movement opened the passing lane?"],["P2011",2,"A","Pressing triggers","5v5 directional game","36×28 m","90","Recognise poor touch, backward pass, closed body","Defending team coordinates press on chosen trigger.","Reward coordinated regain, not isolated sprint.","What told us it was time to press?"],["P2011",2,"B","Compactness and cover","6v6 zoned game","40×30 m","90","Distance between units; pressure-cover-balance","Shift together toward ball side while protecting centre.","Allow switches of play to test compactness.","What space must remain protected?"],["P2011",3,"A","Attacking transition","4v3 → 5v4 waves","40×30 m","90","Recognise overload; speed vs patience","Start 4 attackers vs 3 defenders; transition on turnover.","Introduce one recovering player per team.","When do we accelerate and when do we draw pressure?"],["P2011",3,"B","Defensive transition","5v5 + 2 target players","40×30 m","90","Nearest pressure, cover behind, delay if outnumbered","On loss team chooses counterpress or recovery shape.","Award regain within five seconds only when safe.","When should we counterpress rather than recover?"],["P2011",4,"A","Build-up under pressure","6v5 + keeper or target","44×32 m","90","Open passing lanes, use third player, break line","Play from defensive third into target zone under press.","Change pressing height and direction.","Where is the free player and how can we reach them?"],["P2011",4,"B","Integrated tactical game","7v7 + rotating substitute","48×34 m","90","Apply scanning, pressing, transitions autonomously","Game blocks with limited coach stoppages.","Change score/time scenario between blocks.","Which team decision had the greatest impact?"]];let team='P2013',selected=0;
function choose(t){team=t;selected=0;render()}
function pitch(s){const idx=data.indexOf(s),n=idx%8,older=s[0]==='P2011',a=older?5:3,b=older?5:3;let svg='<svg viewBox="0 0 640 380" role="img" aria-label="Tactical illustration: '+s[4]+'"><rect x="0" y="0" width="640" height="380" fill="#216344"/><rect x="24" y="22" width="592" height="336" fill="none" stroke="#fff" stroke-width="3"/><path d="M320 22V358" stroke="#fff" stroke-width="2" opacity=".8"/><circle cx="320" cy="190" r="53" fill="none" stroke="#fff" stroke-width="2"/><rect x="24" y="125" width="60" height="130" fill="none" stroke="#fff"/><rect x="556" y="125" width="60" height="130" fill="none" stroke="#fff"/><rect x="8" y="160" width="16" height="60" fill="#eee"/><rect x="616" y="160" width="16" height="60" fill="#eee"/>';
const pointsA=[[140,190],[205,110],[205,270],[290,190],[105,95],[105,285],[270,70]],pointsB=[[440,190],[390,100],[390,280],[510,190],[505,90],[505,285],[350,320]];
for(let i=0;i<a;i++){let p=pointsA[(i+n)%pointsA.length];svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="#d4af37" stroke="#111" stroke-width="3"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#111">'+(i+1)+'</text>'}
for(let i=0;i<b;i++){let p=pointsB[(i+n*2)%pointsB.length];svg+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="16" fill="#111" stroke="#eee" stroke-width="2"/><text x="'+p[0]+'" y="'+(p[1]+5)+'" text-anchor="middle" font-size="14" font-weight="700" fill="#fff">'+(i+1)+'</text>'}
let start=pointsA[n%4],end=pointsA[(n+1)%4],run=pointsA[(n+2)%4];svg+='<defs><marker id="arr" markerWidth="8" markerHeight="8" refX="5" refY="3" orient="auto"><path d="M0 0L6 3L0 6" fill="none" stroke="white" stroke-width="1.5"/></marker></defs><path d="M'+start[0]+' '+start[1]+' Q320 145 '+end[0]+' '+end[1]+'" stroke="#fff" stroke-width="3" stroke-dasharray="8 6" fill="none" marker-end="url(#arr)"/><path d="M'+run[0]+' '+run[1]+' Q350 280 500 210" stroke="#d4af37" stroke-width="4" fill="none" marker-end="url(#arr)"/><circle cx="'+(start[0]+22)+'" cy="'+(start[1]+16)+'" r="7" fill="#fff" stroke="#111" stroke-width="2"/><rect x="28" y="30" width="230" height="32" rx="7" fill="#0b0b0bcc"/><text x="40" y="51" font-size="16" fill="white">'+s[4]+'</text></svg>';return svg}
function render(){document.getElementById('t13').classList.toggle('active',team==='P2013');document.getElementById('t11').classList.toggle('active',team==='P2011');let items=data.filter(x=>x[0]===team);document.getElementById('list').innerHTML=items.map((s,i)=>'<button class="session '+(i===selected?'active':'')+'" onclick="selected='+i+';render()"><span>WEEK '+s[1]+' · SESSION '+s[2]+'</span><strong>'+s[3]+'</strong></button>').join('');let s=items[selected],times=team==='P2013'?['10','12','20','25','8']:['12','15','20','35','8'],names=['Arrival game','Perception & technique','Constrained game','Game-realistic application','Reflection'];document.getElementById('detail').innerHTML='<small>WEEK '+s[1]+' · SESSION '+s[2]+' · '+team+'</small><h2>'+s[3]+'</h2><div class="sub">'+s[6]+' minutes · Main game: '+s[4]+' · '+s[5]+'</div><h3>Pitch illustration</h3><div class="pitch">'+pitch(s)+'</div><p class="note">Gold = attacking team · Black = defending team · White dashed arrow = pass · Gold arrow = movement. Schematic example: adjust starting positions to actual exercise.</p><section><h3>Learning outcome & coach observation</h3><p>'+s[7]+'</p></section><section><h3>Organisation & rules</h3><p>'+s[8]+' Split squad into parallel stations or rotate players for meaningful repetitions; use spare balls for immediate restart. Adapt numbers for attendance.</p></section><section><h3>Session timeline</h3><div class="schedule">'+names.map((x,i)=>'<div><b>'+times[i]+' min</b>'+x+'</div>').join('')+'</div></section><section><h3>Progression</h3><p>'+s[9]+'</p><h3>Regression</h3><p>Increase space, add a neutral supporting player, remove restrictive touch limits.</p></section><section><h3>Guided discovery</h3><p>“'+s[10]+'”</p></section><section><h3>Assessment</h3><p>Observe scanning, support, decision speed and transition response. Note 2–3 examples per player: situation → decision → outcome, including good decisions that did not result in goals.</p></section><footer>FC Kindmark Development Framework · Phase 2 · Keep interventions short and prioritise decision quality over flawless technique.</footer>'}
render();
</script></body></html>
